<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gara Ô tô Lúa - Đăng Nhập Hệ Thống</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/utilities.css" />
  </head>
  <body>
    <div class="swing-window">
        <header data-include="titlebar"></header>
        <nav data-include="menubar"></nav>
        <div class="flex-1 flex flex-col garage-backdrop p-1.5 overflow-auto">
          <main id="SCR-01" class="flex-1 p-8 flex items-center justify-center">
            <div class="w-full max-w-md border-2 border-black bg-[#ece9d8] shadow-lg">
              <div class="swing-titlebar">
                <span>Đăng nhập hệ thống</span>
                <span class="text-xs"><i data-lucide="x"></i></span>
              </div>

              <div class="p-4">
                <!-- Logo Branding Box -->
                <div class="text-center pb-3 border-b border-zinc-400 mb-4">
                  <div class="w-12 h-12 mx-auto mb-1 border-2 border-zinc-900 bg-white flex items-center justify-center font-bold text-base">LÚA</div>
                  <div class="font-bold text-xs uppercase">GARA Ô TÔ LÚA - ĐĂNG NHẬP</div>
                </div>

                <form class="space-y-3">
                  <div>
                    <label class="block text-[11px] font-bold mb-0.5">Tên đăng nhập:</label>
                    <input type="text" value="quanly_lua" placeholder="Nhập tên đăng nhập..." class="w-full" />
                  </div>

                  <div>
                    <label class="block text-[11px] font-bold mb-0.5">Mật khẩu:</label>
                    <input type="password" value="******" placeholder="Nhập mật khẩu..." class="w-full" />
                  </div>

                  <!-- Chỉ hỗ trợ đăng nhập: không có ghi nhớ phiên / quên mật khẩu -->
                  <div class="pt-2 flex gap-2">
                    <a href="scr-02.html" class="swing-btn flex-1 swing-btn-primary py-1.5 font-bold">Đăng Nhập</a>
                    <button type="button" class="px-4 py-1.5">Thoát</button>
                  </div>
                </form>
              </div>
            </div>
          </main>
        </div>
        <footer data-include="statusbar"></footer>
      </div>
    <script src="../partials/chrome.js"></script>
  </body>
</html>
