<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gara Ô tô Lúa - Quản Lý &amp; Tra Cứu Xe</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/utilities.css">
</head>
<body>
  <div class="swing-window">
      <header data-include="titlebar"></header>
      <nav data-include="menubar"></nav>
      <div class="flex-1 flex flex-col garage-backdrop p-1.5 overflow-auto">
        <main id="SCR-03B" class="flex-1 flex flex-col space-y-2">

          <div class="grid grid-cols-12 gap-2 flex-1 min-h-0">
            <!-- Left: Form thông tin xe -->
            <div class="col-span-5 swing-panel bg-white !mt-0 flex flex-col justify-between min-h-0">
              <div class="flex-1 min-h-0">
                <span class="swing-panel-legend">Hồ Sơ Phương Tiện Chi Tiết</span>
                <form id="formXe" class="space-y-2.5 mt-1">

                  <div>
                    <label class="block text-[10px] font-bold">Biển Số Xe (*):</label>
                    <input type="text" id="xeBienSo" value="51F12345" placeholder="Nhập biển số (VD: 51F12345)..." class="w-full font-mono font-bold uppercase text-xs">
                  </div>

                  <div class="grid grid-cols-2 gap-2">
                    <div>
                      <label class="block text-[10px] font-bold">Hãng Xe:</label>
                      <select id="xeHang" class="w-full font-bold">
                        <option value="Mazda" selected>Mazda</option>
                        <option value="Toyota">Toyota</option>
                        <option value="Hyundai">Hyundai</option>
                        <option value="Kia">Kia</option>
                        <option value="Honda">Honda</option>
                        <option value="Ford">Ford</option>
                      </select>
                    </div>
                    <div>
                      <label class="block text-[10px] font-bold">Dòng Xe:</label>
                      <input type="text" id="xeDong" value="CX-5 2.0 Premium" class="w-full font-bold">
                    </div>
                  </div>

                  <div class="grid grid-cols-2 gap-2">
                    <div>
                      <label class="block text-[10px] font-bold">Số ODO Hiện Tại (Km) (*):</label>
                      <input type="number" id="xeOdo" value="42500" class="w-full font-mono font-bold text-right">
                    </div>
                    <div>
                      <label class="block text-[10px] font-bold">Năm Sản Xuất:</label>
                      <input type="number" id="xeNamSX" value="2021" class="w-full font-mono">
                    </div>
                  </div>

                </form>
              </div>

              <!-- Cụm 3 nút thao tác -->
              <div class="pt-2 border-t border-zinc-300 mt-2 flex flex-wrap gap-1.5">
                <button type="button" class="flex-1 text-xs py-1 font-bold">Thêm</button>
                <button type="button" class="flex-1 swing-btn-primary font-bold text-xs py-1">Lưu</button>
                <button type="button" class="flex-1 text-xs py-1">Xóa Trắng</button>
              </div>
            </div>

            <!-- Right: Danh sách xe &amp; lịch sử tiếp nhận -->
            <div class="col-span-7 swing-panel bg-white !mt-0 flex flex-col min-h-0">
              <div class="flex justify-between items-center mb-1">
                <span class="swing-panel-legend">Danh Sách Phương Tiện Đã Đăng Ký</span>
              </div>

              <div class="swing-filter-panel">
                <div class="swing-filter-grid">
                  <div class="swing-filter-field">
                    <label>Biển Số</label>
                    <input type="text" data-col="0" placeholder="Nhập...">
                  </div>
                  <div class="swing-filter-field">
                    <label>Hãng Xe</label>
                    <select data-col="1"><option value="">Tất cả</option><option value="Mazda">Mazda</option><option value="Toyota">Toyota</option><option value="Hyundai">Hyundai</option><option value="Kia">Kia</option><option value="Honda">Honda</option><option value="Ford">Ford</option></select>
                  </div>
                  <div class="swing-filter-field">
                    <label>Dòng Xe</label>
                    <input type="text" data-col="2" placeholder="Nhập...">
                  </div>
                  <div class="swing-filter-field">
                    <label>Đời Xe (từ - đến)</label>
                    <div class="swing-filter-range">
                      <input type="number" data-col="3" data-type="number" data-range="min" placeholder="Từ">
                      <span>-</span>
                      <input type="number" data-col="3" data-type="number" data-range="max" placeholder="Đến">
                    </div>
                  </div>
                  <div class="swing-filter-field">
                    <label>ODO (Km) (từ - đến)</label>
                    <div class="swing-filter-range">
                      <input type="number" data-col="4" data-type="number" data-range="min" placeholder="Từ">
                      <span>-</span>
                      <input type="number" data-col="4" data-type="number" data-range="max" placeholder="Đến">
                    </div>
                  </div>
                </div>
                <div class="swing-filter-actions">
                  <input type="text" class="swing-quick-filter" data-filter-quick placeholder="Tìm nhanh...">
                  <span class="text-[10px] text-zinc-500 font-mono" data-filter-count>Hiển thị 4/4</span>
                  <button type="button" class="swing-filter-clear" data-filter-clear title="Xóa lọc">Xóa lọc</button>
                </div>
              </div>
              <div class="overflow-auto mt-2 border border-zinc-400 flex-1 min-h-0">
                <table class="swing-table" id="tableXe" data-filterable>
                  <thead>
                    <tr>
                      <th style="width: 95px;">Biển Số</th>
                      <th style="width: 110px;">Hãng Xe</th>
                      <th>Dòng Xe</th>
                      <th style="width: 70px;">Đời Xe</th>
                      <th style="width: 85px; text-align: right;">ODO (Km)</th>
                      <th style="width: 84px; text-align: center;">Thao Tác</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr class="selected">
                      <td class="font-mono font-bold">51F12345</td>
                      <td class="font-bold text-zinc-900">Mazda</td>
                      <td>CX-5 2.0 Premium</td>
                      <td class="font-mono text-center">2021</td>
                      <td class="font-mono text-right font-bold">42,500</td>
                      <td class="text-center">
                        <div class="flex items-center justify-center gap-1">
                          <button type="button" title="Sửa" aria-label="Sửa" class="!text-[9.5px] !py-0.5 !px-1.5 font-bold"><i data-lucide="pencil"></i></button>
                          <button type="button" title="Xóa" aria-label="Xóa" class="!text-[9.5px] !py-0.5 !px-1.5 text-red-700 font-bold"><i data-lucide="trash-2"></i></button>
                        </div>
                      </td>
                    </tr>
                    <tr>
                      <td class="font-mono font-bold">51A99821</td>
                      <td class="font-bold text-zinc-900">Kia</td>
                      <td>Morning Si</td>
                      <td class="font-mono text-center">2018</td>
                      <td class="font-mono text-right font-bold">86,120</td>
                      <td class="text-center">
                        <div class="flex items-center justify-center gap-1">
                          <button type="button" title="Sửa" aria-label="Sửa" class="!text-[9.5px] !py-0.5 !px-1.5 font-bold"><i data-lucide="pencil"></i></button>
                          <button type="button" title="Xóa" aria-label="Xóa" class="!text-[9.5px] !py-0.5 !px-1.5 text-red-700 font-bold"><i data-lucide="trash-2"></i></button>
                        </div>
                      </td>
                    </tr>
                    <tr>
                      <td class="font-mono font-bold">51G88912</td>
                      <td class="font-bold text-zinc-900">Toyota</td>
                      <td>Corolla Cross 1.8V</td>
                      <td class="font-mono text-center">2022</td>
                      <td class="font-mono text-right font-bold">28,500</td>
                      <td class="text-center">
                        <div class="flex items-center justify-center gap-1">
                          <button type="button" title="Sửa" aria-label="Sửa" class="!text-[9.5px] !py-0.5 !px-1.5 font-bold"><i data-lucide="pencil"></i></button>
                          <button type="button" title="Xóa" aria-label="Xóa" class="!text-[9.5px] !py-0.5 !px-1.5 text-red-700 font-bold"><i data-lucide="trash-2"></i></button>
                        </div>
                      </td>
                    </tr>
                    <tr>
                      <td class="font-mono font-bold">60A33211</td>
                      <td class="font-bold text-zinc-900">Hyundai</td>
                      <td>SantaFe 2.2 Dầu</td>
                      <td class="font-mono text-center">2020</td>
                      <td class="font-mono text-right font-bold">65,400</td>
                      <td class="text-center">
                        <div class="flex items-center justify-center gap-1">
                          <button type="button" title="Sửa" aria-label="Sửa" class="!text-[9.5px] !py-0.5 !px-1.5 font-bold"><i data-lucide="pencil"></i></button>
                          <button type="button" title="Xóa" aria-label="Xóa" class="!text-[9.5px] !py-0.5 !px-1.5 text-red-700 font-bold"><i data-lucide="trash-2"></i></button>
                        </div>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <!-- Lịch sử tiếp nhận đã chuyển sang trang Quản lý phiếu tiếp nhận -->
            </div>
          </div>

        </main>
      </div>
      <footer data-include="statusbar"></footer>
    </div>
  <script src="../partials/chrome.js"></script>
  <script src="../partials/table-filter.js"></script>

</body>
</html>
