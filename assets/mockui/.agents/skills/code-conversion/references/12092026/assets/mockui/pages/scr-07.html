<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gara Ô tô Lúa - Lập Phiếu Nhập Kho Phụ Tùng</title>
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/utilities.css">
</head>
<body>
  <div class="swing-window">
      <header data-include="titlebar"></header>
      <nav data-include="menubar"></nav>
      <div class="flex-1 flex flex-col garage-backdrop p-1.5 overflow-auto">
        <main id="SCR-07" class="flex-1 flex flex-col space-y-2">

          <div class="grid grid-cols-12 gap-2 flex-1 min-h-0">

            <!-- Left: Thông tin phiếu nhập -->
            <div class="col-span-5 swing-panel bg-white !mt-0 flex flex-col justify-between min-h-0">
              <div class="flex-1 min-h-0">
                <span class="swing-panel-legend">Thông Tin Phiếu Nhập</span>
                <form class="space-y-2.5 mt-1">

                  <div>
                    <label class="block text-[10px] font-bold">Mã Phiếu Nhập:</label>
                    <input type="text" value="PN202609290001" readonly class="w-full bg-zinc-100 font-mono font-bold">
                  </div>

                  <div>
                    <label class="block text-[10px] font-bold">Ngày Tạo:</label>
                    <input type="text" value="29/09/2026 14:45" readonly class="w-full bg-zinc-100 font-mono">
                  </div>

                  <div>
                    <label class="block text-[10px] font-bold">Thủ Kho Thực Hiện:</label>
                    <input type="text" value="NV000004 - Đặng Thanh Quý Bửu" readonly class="w-full bg-zinc-100">
                  </div>

                  <div>
                    <label class="block text-[10px] font-bold">Mô Tả:</label>
                    <input type="text" value="Lô nhập bổ sung đầu tháng 9/2026" class="w-full">
                  </div>

                </form>
              </div>

              <!-- Hành động phiếu nhập -->
              <div class="pt-2 border-t border-zinc-300 mt-2 flex flex-wrap gap-1.5">
                <button type="button" class="flex-1 text-xs py-1">Làm Mới</button>
                <button type="button" class="flex-1 swing-btn-primary font-bold text-xs py-1">Lưu Phiếu Nhập</button>
              </div>
            </div>

            <!-- Right: Danh sách chi tiết hàng nhập -->
            <div class="col-span-7 swing-panel bg-white !mt-0 flex flex-col min-h-0">
              <div class="flex justify-between items-center mb-1">
                <span class="swing-panel-legend">Danh Sách Chi Tiết Hàng Nhập</span>
                <div class="flex gap-1.5 -mt-1">
                  <button type="button" class="swing-btn-primary text-[10.5px] px-2 py-0.5 font-bold">Thêm Dòng</button>
                  <button type="button" class="text-[10.5px] px-2 py-0.5 font-bold text-red-700">Xóa Dòng</button>
                </div>
              </div>

              <div class="overflow-auto mt-2 border border-zinc-400 flex-1 min-h-0">
                <table class="swing-table">
                  <thead>
                    <tr>
                      <th style="width: 40px;">#</th>
                      <th style="width: 110px;">Mã Phụ Tùng</th>
                      <th>Tên Phụ Tùng Nhập</th>
                      <th style="width: 90px;">Số Lượng</th>
                      <th style="width: 120px;">Đơn Giá Nhập</th>
                      <th style="width: 130px;">Thành Tiền (VNĐ)</th>
                      <th style="width: 70px;">Thao Tác</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td class="text-center font-mono">1</td>
                      <td class="font-mono font-bold">PT000102</td>
                      <td>Lọc dầu nhớt động cơ Toyota</td>
                      <td class="text-right font-mono font-bold">20</td>
                      <td class="text-right font-mono">120,000</td>
                      <td class="text-right font-mono font-bold">2,400,000</td>
                      <td class="text-center"><button type="button" class="!text-[9.5px] !py-0.5 !px-1 text-red-700 font-bold">Xóa</button></td>
                    </tr>
                    <tr>
                      <td class="text-center font-mono">2</td>
                      <td class="font-mono font-bold">PT000089</td>
                      <td>Má phanh đĩa trước Mazda CX-5</td>
                      <td class="text-right font-mono font-bold">10</td>
                      <td class="text-right font-mono">850,000</td>
                      <td class="text-right font-mono font-bold">8,500,000</td>
                      <td class="text-center"><button type="button" class="!text-[9.5px] !py-0.5 !px-1 text-red-700 font-bold">Xóa</button></td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <!-- Tổng chi phí &amp; xác nhận hoàn tất -->
              <div class="mt-2 p-2 bg-zinc-50 border border-zinc-400 flex flex-wrap justify-between items-center gap-2">
                <div class="flex items-center gap-3">
                  <span class="text-[10px] text-zinc-500 uppercase font-bold">Tổng chi phí nhập:</span>
                  <span class="font-mono text-base font-bold text-black">10,900,000 VNĐ</span>
                </div>
                <button type="button" class="swing-btn-primary font-bold text-xs py-1 px-4">
                   Xác Nhận Hoàn Tất
                </button>
              </div>
            </div>

          </div>

        </main>
      </div>
      <footer data-include="statusbar"></footer>
    </div>
  <script src="../partials/chrome.js"></script>
</body>
</html>
