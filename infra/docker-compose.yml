services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: iuh-ptud-mssql
    environment:
      ACCEPT_EULA: "${IUH_PTUD_MSSQL_ACCEPT_EULA:-Y}"
      MSSQL_SA_PASSWORD: "${IUH_PTUD_DB_PASSWORD:-YourStrong!Passw0rd}"
      MSSQL_PID: "${IUH_PTUD_MSSQL_PID:-Developer}"
    ports:
      - "${IUH_PTUD_DB_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U ${IUH_PTUD_DB_USER:-sa} -P '${IUH_PTUD_DB_PASSWORD:-YourStrong!Passw0rd}' -C -Q 'SELECT 1' || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: iuh-ptud-db-init
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      IUH_PTUD_DB_HOST: mssql
      IUH_PTUD_DB_PORT: 1433
      IUH_PTUD_DB_USER: "${IUH_PTUD_DB_USER:-sa}"
      IUH_PTUD_DB_PASSWORD: "${IUH_PTUD_DB_PASSWORD:-YourStrong!Passw0rd}"
      IUH_PTUD_DB_NAME: "${IUH_PTUD_DB_NAME:-iuh_ptud_db}"
    volumes:
      - ./init-db.sh:/init-db.sh:ro
    entrypoint: ["/bin/bash", "/init-db.sh"]

  flyway:
    image: flyway/flyway
    container_name: iuh-ptud-flyway
    depends_on:
      db-init:
        condition: service_completed_successfully
    command:
      - -url=jdbc:sqlserver://mssql:1433;databaseName=${IUH_PTUD_DB_NAME:-iuh_ptud_db};encrypt=true;trustServerCertificate=true
      - -user=${IUH_PTUD_DB_USER:-sa}
      - -password=${IUH_PTUD_DB_PASSWORD:-YourStrong!Passw0rd}
      - -locations=filesystem:/flyway/sql
      - migrate
    volumes:
      - ./migrations:/flyway/sql

volumes:
  mssql_data: